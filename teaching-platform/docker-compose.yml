# 一键部署：docker compose up -d --build
# 首次部署后执行一次初始化（创建教师账号和示范课）：
#   docker compose exec app node scripts/seed.mjs
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: teaching
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d teaching"]
      interval: 5s
      retries: 10
    # 数据库不对外开放端口

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tp:${DB_PASSWORD}@db:5432/teaching
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TEACHER_USERNAME: ${TEACHER_USERNAME:-teacher}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-teacher123}
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-80}:3000"

volumes:
  pgdata:
  uploads:
