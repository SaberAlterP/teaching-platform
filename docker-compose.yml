# 一键部署：docker compose up -d --build
# 首次部署后执行一次初始化（创建教师账号和示范课）：
#   docker compose exec app node scripts/seed.mjs

# 日志最多保留 3 个 10MB 的文件，防止日志把硬盘占满
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    mem_limit: 512m # 内存上限，异常时不会拖垮整台服务器
    # 小内存服务器：把连接数上限从默认 100 降到 30（每个连接都占内存），应用连接池最多用 10 个
    command: ["postgres", "-c", "max_connections=30", "-c", "random_page_cost=1.1"]
    environment:
      POSTGRES_USER: tp
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      POSTGRES_DB: teaching
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp -d teaching"]
      interval: 5s
      retries: 10
    # 数据库不对外开放端口

  app:
    build: .
    restart: unless-stopped
    logging: *logging
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://tp:${DB_PASSWORD}@db:5432/teaching
      AUTH_SECRET: ${AUTH_SECRET:?请在 .env 中设置 AUTH_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      TEACHER_USERNAME: ${TEACHER_USERNAME:-teacher}
      TEACHER_PASSWORD: ${TEACHER_PASSWORD:-teacher123}
      NODE_OPTIONS: --max-old-space-size=512 # 让 Node 在内存上限以内主动回收
    volumes:
      - uploads:/data/uploads
    ports:
      - "${APP_PORT:-80}:3000"

volumes:
  pgdata:
  uploads:
