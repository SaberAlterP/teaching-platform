<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>分拨中心出港装车</title>
<!-- 平台内置 three.js 和 tp3d 部件库：不要用 CDN，不要自己打包 -->
<script type="importmap">{"imports":{"three":"/lib/three/three.module.js","three/addons":"/lib/three/addons.js","tp3d":"/lib/tp3d/tp3d.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import * as T from "tp3d";

/* 场景清单（第一阶段：先列清单，再搭场景）
   区域：分拨中心厂房（5 个装卸门 + 月台）、库内待装区 / 建包区 / 异常件区、门前停车位、场内道路、门岗
   设备：厢式货车 ×2（6 号月台作业车 + 4 号月台已靠台车）、半挂车（停车场等待）、叉车、托盘货 ×5、笼车 ×3、输送机
   人物：叉车司机（在车上不建人）、装车员、监装员、门岗保安
   氛围：云和飞鸟（自动）、树摆动、场内循环行驶的面包车、走动的工人、叉车警示灯
*/
const app = T.createApp({ title: "分拨中心出港装车", ground: "concrete", size: 150, camera: { pos: [34, 24, 46], target: [0, 1, 6] } });
const { lerp, seg, path, V } = T;

// ---------- 第二阶段：搭场景 ----------
// 厂房正面朝 +z，正面墙在 z = 0，月台 z 0~3、高 1.2 m；库内地面高 1.2 m
const wh = app.add(T.warehouse({ w: 44, d: 22, h: 9, doors: 5, firstNo: 4, sign: "城东分拨中心", sub: "OUTBOUND DOCK", open: [0, 2] }), 0, 0, -11);
const D = wh.userData.doorX, FLOOR = wh.userData.dockH;
// 库内分区（地面分区是画面精细度的关键）
app.add(T.zone({ w: 10, d: 6, name: "6 号月台待装区", color: "#16a34a" }), D[2], FLOOR, -4.5);
app.add(T.zone({ w: 12, d: 6, name: "建包封发区", color: "#2563eb" }), -12, FLOOR, -14);
app.add(T.zone({ w: 8, d: 5, name: "异常件暂存", color: "#dc2626" }), 15, FLOOR, -15);
app.add(T.markLine([[-21, -8.5], [21, -8.5]], { color: 0xf2b705, width: 0.12 }), 0, FLOOR, 0);
app.add(T.markLine([[-21, -9.4], [21, -9.4]], { color: 0xf2b705, width: 0.12 }), 0, FLOOR, 0);
// 室外：停车位标线、待装车位、场内道路、地面箭头
for (const x of D) for (const s of [-1.7, 1.7]) app.add(T.markLine([[x + s, 3.2], [x + s, 16]], { color: 0xffffff, width: 0.12 }));
app.add(T.zone({ w: 4, d: 13, name: "待装", color: "#facc15", dashed: true, fill: 0.05 }), 0, 0, 25);
app.add(T.road({ length: 150, width: 8, sidewalk: 0 }), 0, 0, 36);
app.add(T.arrow({ size: 3 }), -20, 0, 34.5);
app.add(T.arrow({ size: 3 }), 20, 0, 37.5, Math.PI);
// 库内货物和设备
const pallets = [];
for (let i = 0; i < 5; i++) pallets.push(app.add(T.palletLoad({ layers: 3 + (i % 2) }), D[2] - 3.6 + i * 1.8, FLOOR, -5));
for (let i = 0; i < 3; i++) app.add(T.cageCart({ bags: 2 + i }), -16 + i * 1.6, FLOOR, -13);
app.add(T.conveyor({ length: 14, height: 0.8 }), -10, FLOOR, -17);
for (let i = 0; i < 5; i++) app.add(T.parcel(), -15 + i * 2.4, FLOOR + 0.8, -17);
for (let i = 0; i < 4; i++) app.add(T.carton({ w: 0.6, h: 0.5, d: 0.5, label: i === 1 ? "破损" : "" }), 13 + (i % 2) * 0.8, FLOOR, -15 + Math.floor(i / 2) * 0.8);
// 车辆：车头朝 +z（ry = -90°），车尾贴月台
const truckA = app.add(T.truck({ text: "顺达快运 · 干线", plate: "沪A·D6061" }), D[2], 0, 9.2, -Math.PI / 2);
app.add(T.truck({ text: "城际冷链", reefer: true, plate: "沪B·L0412" }), D[0], 0, 9.2, -Math.PI / 2).userData.setDoors(1);
app.add(T.semi({ text: "干线甩挂", plate: "沪C·G1180" }), 40, 0, 22, -Math.PI / 2);
const fork = app.add(T.forklift(), D[2], FLOOR, -6.6, -Math.PI / 2);
const worker = app.add(T.person({ vest: 0xf97316 }), D[2] + 2.2, FLOOR, 1.6, Math.PI);
const checker = app.add(T.person({ vest: 0x2563eb, hat: 0xffffff }), D[2] - 2.4, FLOOR, 1.8, -Math.PI / 2);
app.add(T.office({ w: 6, d: 5, floors: 1, sign: "门岗" }), -45, 0, 28);
app.add(T.person({ vest: 0x1f2937, hat: 0x1f2937 }), -41, 0, 31, -Math.PI / 2);
for (let x = -60; x <= 60; x += 12) app.add(T.tree({ s: 0.9 + (x % 5) * 0.03 }), x, 0, 43);
for (const x of [-30, 30]) app.add(T.lamp({ h: 10 }), x, 0, 18);
for (let i = 0; i < 3; i++) app.add(T.cone(), D[2] + 1.9, 0, 18 + i * 1.5);
// 氛围：场内循环行驶的面包车、走动的工人
app.ambient({
  traffic: [{ obj: T.van({ text: "同城配送" }), points: [[-75, 34], [75, 34]], speed: 8 }, { obj: T.van({ color: 0xfef3c7, brand: "#b45309", text: "社区团购" }), points: [[75, 38], [-75, 38]], speed: 6 }],
  people: [{ obj: T.person({ vest: 0xfacc15 }), points: [[-20, -7], [10, -7], [10, -10], [-20, -10], [-20, -7]], speed: 1.2 }],
});
app.label("城东分拨中心", wh, { kind: "big", keep: true });

// ---------- 第三阶段：讲解步骤 + 小问 ----------
// update(p) 里按进度 p（0~1）直接算出物体位置，用 seg(p, a, b) 把一步拆成几个小动作
const pal = pallets[2], palHome = pal.position.clone();
const palInTruck = V(D[2], 1.25, 11.6);                                  // 车厢内靠前墙
const forkIn = path([[D[2], -6.6], [D[2], 1.2], [D[2], 10]], { y: FLOOR }); // 叉车从托盘后面开进车厢
app.steps([
  {
    title: "车辆靠台", dur: 6, cam: { pos: [18, 10, 34], target: [0, 1.5, 12] },
    text: "干线车按调度指定的 <b>6 号月台</b>倒车靠台：车尾对正月台，垫好轮挡，拉手刹熄火。",
    update(p) { truckA.position.z = lerp(30, 9.2, seg(p, 0, 0.8)); truckA.userData.setDoors(0); },
    ask: { q: "车辆靠台停稳后，装车前第一件事是什么？", options: ["打开车门直接装货", "垫好轮挡、确认车辆制动", "先施封", "先打印交接单"], answer: 1, explain: "防止车辆溜车是月台作业的第一安全要求，装车前必须垫轮挡并确认手刹。" },
  },
  {
    title: "开门验车", dur: 6, cam: { pos: [9, 6, 18], target: [0, 2, 7] },
    text: "打开后门，检查车厢：<b>干净、干燥、无异味、无破损</b>，地板无钉子，门封条完好。",
    enter() { app.label("检查车厢", truckA, { kind: "warn" }); },
    update(p) { truckA.userData.setDoors(seg(p, 0.1, 0.6)); checker.userData.pose(0, -1.4 * seg(p, 0.5, 0.8)); },
  },
  {
    title: "叉车装车", dur: 10, cam: { pos: [16, 10, 0], target: [0, 1.5, 4] },
    text: "叉车从待装区叉起托盘，<b>重货在下、先装靠前</b>，托盘靠车厢前墙放稳，人员远离叉车作业半径。",
    enter() { wh.userData.cutaway(true); app.label("待装托盘", pal, { kind: "num" }); },
    update(p) {
      truckA.userData.setDoors(1);
      // 0~0.1 叉起 → 0.1~0.5 开进车厢 → 0.5~0.6 放下 → 0.6~0.95 倒出来
      forkIn.place(fork, seg(p, 0.1, 0.5) - seg(p, 0.6, 0.95), false);
      fork.rotation.y = -Math.PI / 2;
      fork.userData.setLift(0.3 * (seg(p, 0, 0.1) - seg(p, 0.5, 0.6)));
      if (p === 0) pal.position.copy(palHome);
      else if (p < 0.6) { fork.updateMatrixWorld(true); fork.userData.fork.localToWorld(pal.position.set(1.65, 0.05, 0)); }
      else pal.position.copy(palInTruck);
    },
    ask: { q: "叉车往车厢里放第一托货，应该放在哪里？", options: ["靠车厢前墙", "车厢中间", "靠近车门", "随便放，后面再调整"], answer: 0, explain: "从前往后装，第一托靠前墙放稳，后续逐托往后排，避免运输中前后窜动。" },
  },
  {
    title: "施封与交接", dur: 7, cam: { pos: [3.2, 3.4, -0.6], target: [0, 1.9, 3.4] },
    text: "装完关门，监装员加 <b>施封锁</b>，在交接单上记录封签号、车牌、件数，司机签字后发车。",
    enter() { wh.userData.cutaway(false); this.tag = app.label("封签号 SF2026-0418", truckA.userData.seal, { kind: "ok" }); },
    update(p) {
      pal.position.copy(palInTruck);
      truckA.userData.setDoors(1 - seg(p, 0, 0.4));
      truckA.userData.seal.visible = p > 0.5;
      this.tag?.show(p > 0.5);
    },
    ask: { q: "施封后交接单上必须记录的是？", options: ["封签号、车牌号、件数", "司机的手机号", "天气情况", "叉车编号"], answer: 0, explain: "封签号 + 车牌 + 件数是到达站核对“车、封、货”是否一致的依据。" },
  },
]);

// 额外 2 道题（拓展 / 情境判断）
app.quiz([
  { q: "（拓展）同一辆车装多个卸货站的货，应该怎样安排装车顺序？", options: ["先卸的先装", "后卸的先装（放里面）", "按重量随机", "按到货时间"], answer: 1, explain: "“后卸先装、先卸后装”，到站时靠门的货就是要卸的，不用翻货。" },
  { q: "（情境）监装员发现一托货外包装破损渗漏，正确做法是？", options: ["照常装车", "拆开重新包装后直接装", "移到异常件暂存区，登记并上报", "丢弃"], answer: 2, explain: "破损件不能装车，应隔离到异常件区，拍照登记、上报处理，避免污染其他货物。" },
], { weight: 60 });

// 实训：点选托盘，按“重货先装”找出最重的一托（数据每次随机）
const t = app.task("找出先装的托盘", 40);
const kg = pallets.map(() => 300 + Math.round(Math.random() * 50) * 10);
const kgTags = pallets.map((pl, i) => app.label(`${kg[i]}kg`, pl, { dy: 0.2 + (i % 2) * 0.5, keep: true }));
kgTags.forEach((l) => l.show(false));
// 打开“实训”页时才显示重量标签，并把镜头转到待装区
const box = app.panel("实训", { onShow() { kgTags.forEach((l) => l.show(true)); wh.userData.cutaway(true); app.flyTo([12, 10, -16], [0, 1.2, -5]); } });
box.innerHTML = "<p>库内 5 托货的重量已经标在托盘上。按 <b>重货在下、先装</b> 的原则，请直接在 3D 画面里 <b>点击最先装车的那一托</b>。</p><p>只有一次机会。</p>";
let tried = false;
app.pick(pallets, (pl) => {
  if (tried) return;
  tried = true;
  const i = pallets.indexOf(pl), ok = kg[i] === Math.max(...kg);
  app.highlight(pl, ok ? 0x16a34a : 0xdc2626);
  t.done(ok ? 100 : 30);
  box.innerHTML += ok ? "<p style='color:#15803d'>✔ 正确：这一托最重，应最先装车。</p>" : `<p style='color:#b91c1c'>✘ 不对：最重的是 ${Math.max(...kg)} kg 那一托。</p>`;
  app.toast(ok ? "正确！" : "再想想“重货先装”", ok ? "ok" : "bad");
});
</script>
</body>
</html>
